<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin — Eatery Example</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #222;
      line-height: 1.5;
      padding: 1.5rem;
      max-width: 700px;
      margin: 0 auto;
    }
    h1 { margin-bottom: 1.5rem; }
    h2 { margin: 2rem 0 1rem; }

    #login-gate {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      max-width: 300px;
    }
    #login-gate input {
      padding: 0.6rem;
      font-size: 1rem;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    #login-gate button {
      padding: 0.75rem;
      font-weight: 600;
      background: #222;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    #login-error {
      color: #b00020;
      font-weight: 600;
    }

    #admin-content {
      display: none;
    }

    .res-card, .item-card {
      border: 1px solid #eee;
      border-radius: 6px;
      padding: 1rem;
      margin-bottom: 1rem;
    }
    .res-card p, .item-card p {
      margin: 0.25rem 0;
    }
    .status-pending { color: #b8860b; font-weight: 600; }
    .status-confirmed { color: #1a7f37; font-weight: 600; }
    .status-declined { color: #b00020; font-weight: 600; }

    .btn-row {
      display: flex;
      gap: 0.5rem;
      margin-top: 0.75rem;
    }
    .btn-row button {
      padding: 0.5rem 1rem;
      border: none;
      border-radius: 4px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-confirm { background: #1a7f37; color: #fff; }
    .btn-decline { background: #b00020; color: #fff; }

    .item-card label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      margin-top: 0.5rem;
    }
    .item-card input, .item-card textarea {
      width: 100%;
      padding: 0.5rem;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 0.95rem;
      margin-top: 0.25rem;
    }
    .item-card .save-btn {
      margin-top: 0.75rem;
      padding: 0.5rem 1rem;
      background: #222;
      color: #fff;
      border: none;
      border-radius: 4px;
      font-weight: 600;
      cursor: pointer;
    }
    .availability-toggle {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-top: 0.5rem;
    }
  </style>
</head>
<body>

  <h1>Eatery Example — Admin</h1>

  <div id="login-gate">
    <label for="admin-password">Admin Password</label>
    <input type="password" id="admin-password" placeholder="Enter password">
    <button id="login-btn">Log In</button>
    <p id="login-error"></p>
  </div>

  <div id="admin-content">
    <h2>Reservations</h2>
    <div id="reservations-list">
      <p>Loading reservations...</p>
    </div>

    <h2>Menu Items</h2>
    <div id="menu-editor-list">
      <p>Loading menu items...</p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
