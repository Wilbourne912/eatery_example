<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eatery Example</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #222;
      line-height: 1.5;
    }

    .site-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 1.5rem;
      border-bottom: 1px solid #eee;
    }

    .site-header nav a {
      margin-left: 1.5rem;
      text-decoration: none;
      color: #222;
      font-weight: 600;
    }

    #hero {
      padding: 3rem 1.5rem;
      text-align: center;
      background: #faf7f2;
    }

    #hero h2 {
      font-size: 2rem;
      margin-bottom: 0.5rem;
    }

    main section {
      padding: 2rem 1.5rem;
      max-width: 700px;
      margin: 0 auto;
    }

    #menu-list .menu-item {
      display: flex;
      justify-content: space-between;
      padding: 0.75rem 0;
      border-bottom: 1px solid #eee;
    }

    #menu-list .menu-item.unavailable {
      opacity: 0.4;
    }

    #reservation-form {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      max-width: 400px;
    }

    #reservation-form label {
      display: flex;
      flex-direction: column;
      font-weight: 600;
      font-size: 0.9rem;
      gap: 0.25rem;
    }

    #reservation-form input {
      padding: 0.6rem;
      font-size: 1rem;
      border: 1px solid #ccc;
      border-radius: 4px;
    }

    #reservation-form button {
      padding: 0.75rem;
      font-size: 1rem;
      font-weight: 600;
      background: #222;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }

    #reservation-form button:hover {
      background: #444;
    }

    #reservation-status {
      margin-top: 1rem;
      font-weight: 600;
    }

    footer {
      text-align: center;
      padding: 1.5rem;
      color: #888;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>

  <header class="site-header">
    <h1>Eatery Example</h1>
    <nav>
      <a href="#menu">Menu</a>
      <a href="#reserve">Reserve</a>
    </nav>
  </header>

  <main>
    <section id="hero">
      <h2>Good food. No hassle.</h2>
      <p>Book a table in seconds.</p>
    </section>

    <section id="menu">
      <h2>Menu</h2>
      <div id="menu-list">
        <!-- menu items get injected here by menu.js -->
        <p>Loading menu...</p>
      </div>
    </section>

    <section id="reserve">
      <h2>Reserve a Table</h2>
      <form id="reservation-form">
        <label>
          Name
          <input type="text" id="res-name" required>
        </label>
        <label>
          Phone
          <input type="tel" id="res-phone" required>
        </label>
        <label>
          Party Size
          <input type="number" id="res-party-size" min="1" max="20" required>
        </label>
        <label>
          Date
          <input type="date" id="res-date" required>
        </label>
        <label>
          Time
          <input type="time" id="res-time" required>
        </label>
        <button type="submit">Request Reservation</button>
      </form>
      <p id="reservation-status"></p>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 Eatery Example</p>
  </footer>

  <!-- Supabase client library -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Your Supabase URL/key -->
  <script src="js/supabase-config.js"></script>
  <!-- Menu loading logic -->
  <script src="js/menu.js"></script>
  <!-- Reservation form logic -->
  <script src="js/reservations.js"></script>
</body>
</html>
