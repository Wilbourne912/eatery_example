<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eatery Example</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #222;
      line-height: 1.5;
    }

    .site-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 1.5rem;
      border-bottom: 1px solid #eee;
    }

    .site-header nav a {
      margin-left: 1.5rem;
      text-decoration: none;
      color: #222;
      font-weight: 600;
    }

    #hero {
      padding: 3rem 1.5rem;
      text-align: center;
      background: #faf7f2;
    }

    #hero h2 {
      font-size: 2rem;
      margin-bottom: 0.5rem;
    }

    main section {
      padding: 2rem 1.5rem;
      max-width: 700px;
      margin: 0 auto;
    }

    #menu-list .menu-item {
      display: flex;
      justify-content: space-between;
      padding: 0.75rem 0;
      border-bottom: 1px solid #eee;
    }

    #menu-list .menu-item.unavailable {
      opacity: 0.4;
    }

    #reservation-form {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      max-width: 400px;
    }

    #reservation-form label {
      display: flex;
      flex-direction: column;
      font-weight: 600;
      font-size: 0.9rem;
      gap: 0.25rem;
    }

    #reservation-form input {
      padding: 0.6rem;
      font-size: 1rem;
      border: 1px solid #ccc;
      border-radius: 4px;
    }

    #reservation-form button {
      padding: 0.75rem;
      font-size: 1rem;
      font-weight: 600;
      background: #222;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }

    #reservation-form button:hover {
      background: #444;
    }

    #reservation-status {
      margin-top: 1rem;
      font-weight: 600;
    }

    #order-menu-list .order-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.75rem 0;
      border-bottom: 1px solid #eee;
      gap: 1rem;
    }

    #order-menu-list .order-item.unavailable {
      opacity: 0.4;
    }

    #order-menu-list button {
      padding: 0.4rem 0.9rem;
      background: #222;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      white-space: nowrap;
    }

    #cart-box {
      margin-top: 2rem;
      padding: 1rem;
      border: 1px solid #ddd;
      border-radius: 6px;
    }

    .cart-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.5rem 0;
      border-bottom: 1px solid #eee;
    }

    .qty-controls {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .qty-controls button {
      width: 1.8rem;
      height: 1.8rem;
      border: 1px solid #ccc;
      background: #fff;
      border-radius: 4px;
      cursor: pointer;
    }

    #cart-total {
      font-weight: 700;
      margin: 1rem 0;
      font-size: 1.1rem;
    }

    #checkout-form {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    #checkout-form label {
      display: flex;
      flex-direction: column;
      font-weight: 600;
      font-size: 0.9rem;
      gap: 0.25rem;
    }

    #checkout-form input, #checkout-form textarea {
      padding: 0.6rem;
      font-size: 1rem;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-family: inherit;
    }

    #checkout-btn {
      padding: 0.75rem;
      font-weight: 600;
      background: #222;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }

    #checkout-btn:disabled {
      background: #999;
      cursor: not-allowed;
    }

    .delivery-link-btn {
      display: inline-block;
      margin: 0.5rem 0 1rem;
      padding: 0.6rem 1rem;
      background: #4A5D3A;
      color: #fff;
      text-decoration: none;
      border-radius: 4px;
      font-weight: 600;
    }

    #order-type-toggle {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1.5rem;
    }

    .order-type-btn {
      padding: 0.6rem 1.2rem;
      border: 1px solid #222;
      background: #fff;
      color: #222;
      border-radius: 4px;
      font-weight: 600;
      cursor: pointer;
    }

    .order-type-btn.active {
      background: #222;
      color: #fff;
    }

    footer {
      text-align: center;
      padding: 1.5rem;
      color: #888;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>

  <header class="site-header">
    <h1>Eatery Example</h1>
    <nav>
      <a href="#menu">Menu</a>
      <a href="#reserve">Reserve</a>
    </nav>
  </header>

  <main>
    <section id="hero">
      <h2>Good food. No hassle.</h2>
      <p>Book a table in seconds.</p>
    </section>

    <section id="menu">
      <h2>Menu</h2>
      <div id="menu-list">
        <!-- menu items get injected here by menu.js -->
        <p>Loading menu...</p>
      </div>
    </section>

    <section id="order">
      <h2>Order Online</h2>

      <div id="order-type-toggle">
        <button type="button" id="toggle-pickup" class="order-type-btn active">Pickup</button>
        <button type="button" id="toggle-delivery" class="order-type-btn">Delivery</button>
      </div>

      <div id="pickup-flow">
        <div id="order-menu-list">
          <p>Loading menu...</p>
        </div>

        <div id="cart-box">
          <h3>Your Order</h3>
          <div id="cart-list">
            <p>Your cart is empty.</p>
          </div>
          <p id="cart-total"></p>

          <form id="checkout-form">
            <label>
              Name
              <input type="text" id="order-name" required>
            </label>
            <label>
              Phone
              <input type="tel" id="order-phone" required>
            </label>
            <label>
              Notes (optional)
              <textarea id="order-notes" rows="2"></textarea>
            </label>
          <button type="submit" id="checkout-btn" disabled>Place Pickup Order</button>
        </form>
        <p id="checkout-status"></p>
      </div>
      </div>

      <div id="delivery-flow" style="display:none;">
        <div id="delivery-option"></div>
      </div>
    </section>

    <section id="reserve">
      <h2>Reserve a Table</h2>
      <form id="reservation-form">
        <label>
          Name
          <input type="text" id="res-name" required>
        </label>
        <label>
          Phone
          <input type="tel" id="res-phone" required>
        </label>
        <label>
          Party Size
          <input type="number" id="res-party-size" min="1" max="20" required>
        </label>
        <label>
          Date
          <input type="date" id="res-date" required>
        </label>
        <label>
          Time
          <input type="time" id="res-time" required>
        </label>
        <button type="submit">Request Reservation</button>
      </form>
      <p id="reservation-status"></p>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 Eatery Example</p>
  </footer>

  <!-- Supabase client library -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Your Supabase URL/key -->
  <script src="js/supabase-config.js"></script>
  <!-- Menu loading logic -->
  <script src="js/menu.js"></script>
  <!-- Reservation form logic -->
  <script src="js/reservations.js"></script>
  <!-- Online ordering / cart logic -->
  <script src="js/ordering.js"></script>
</body>
</html>
