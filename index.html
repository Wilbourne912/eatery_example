<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eatery Example</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="site-header">
    <h1>Eatery Example</h1>
    <nav>
      <a href="#menu">Menu</a>
      <a href="#reserve">Reserve</a>
    </nav>
  </header>

  <main>
    <section id="hero">
      <h2>Good food. No hassle.</h2>
      <p>Book a table in seconds.</p>
    </section>

    <section id="menu">
      <h2>Menu</h2>
      <div id="menu-list">
        <!-- menu items get injected here by menu.js -->
        <p>Loading menu...</p>
      </div>
    </section>

    <section id="reserve">
      <h2>Reserve a Table</h2>
      <p>(Booking form goes here — next step)</p>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 Eatery Example</p>
  </footer>

  <!-- Supabase client library -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Your Supabase URL/key -->
  <script src="js/supabase-config.js"></script>
  <!-- Menu loading logic -->
  <script src="js/menu.js"></script>
</body>
</html>
